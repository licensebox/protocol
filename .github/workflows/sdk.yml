name: SDK conformance
on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
      protocol_ref:
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    env:
      LICENSEBOX_PROTOCOL_DIR: ${{ github.workspace }}/protocol
    steps:
      - uses: actions/checkout@v4
        with:
          path: sdk
          persist-credentials: false
      - name: Resolve contract pin
        id: pin
        env:
          REQUESTED_REF: ${{ inputs.protocol_ref }}
          SDK_LANGUAGE: ${{ inputs.language }}
        run: |
          python3 - <<'PY'
          import json,os,re
          assert re.fullmatch('[a-z][a-z0-9-]{0,31}',os.environ['SDK_LANGUAGE'])
          lock=json.load(open('sdk/protocol-lock.json'))
          assert lock['repository']=='licensebox/protocol'
          ref=os.environ['REQUESTED_REF'] or lock['ref']
          assert re.fullmatch('[0-9a-f]{40}',ref)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('ref='+ref+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: licensebox/protocol
          ref: ${{ steps.pin.outputs.ref }}
          path: protocol
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'cryptography>=43'
      - name: Prepare tested contract metadata
        id: metadata
        env:
          SDK_LANGUAGE: ${{ inputs.language }}
          CONTRACT_REF: ${{ steps.pin.outputs.ref }}
        run: |
          python3 -B protocol/scripts/update_lock.py sdk protocol --language "$SDK_LANGUAGE" --ref "$CONTRACT_REF"
          python3 -B - <<'PYCODE'
          import json,os,sys
          from pathlib import Path
          contract=json.load(open('protocol/contract.json'))
          language=os.environ['SDK_LANGUAGE']
          if Path('protocol/scripts/registry.py').is_file():
              sys.path.insert(0,'protocol/scripts')
              from registry import registered
              client=registered(contract,language)
          else:
              # Original public locks predate registry.py. This immutable
              # revision alone has the original five non-FFI SDK profiles.
              assert os.environ['CONTRACT_REF']=='abb8a6f1ae4c4874b431ce38dc1d53ca3d6ce77d'
              legacy={name:'licensebox/'+name for name in ('go','python','javascript','c','cpp')}
              assert contract['protocol']==2 and contract['revision']==1
              assert set(contract['clients'])==set(legacy) and language in legacy
              client=contract['clients'][language]
              assert client['repository']==legacy[language]
              assert client.get('native_c',False) is False and client.get('custom_ci',False) is False
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('native='+str(client.get('native_c',False)).lower()+'\ncustom='+str(client.get('custom_ci',False)).lower()+'\n')
          PYCODE
      - if: inputs.language == 'python'
        run: python3 -m pip install -e sdk
      - if: inputs.language == 'python'
        working-directory: sdk
        env:
          LICENSEBOX_TEST_NATIVE: '1'
        run: python3 -m unittest discover -s tests
      - if: inputs.language == 'python'
        working-directory: protocol
        run: |
          python3 conformance/run.py --adapter python3 ../sdk/tests/adapter.py
          python3 conformance/heartbeat.py --adapter python3 ../sdk/tests/adapter.py
      - if: inputs.language == 'javascript'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: inputs.language == 'javascript'
        working-directory: sdk
        run: npm ci --ignore-scripts --no-audit --no-fund
      - if: inputs.language == 'javascript'
        working-directory: sdk
        env:
          LICENSEBOX_TEST_NATIVE: '1'
        run: npm test
      - if: inputs.language == 'javascript'
        working-directory: protocol
        run: |
          python3 conformance/run.py --adapter node ../sdk/test/adapter.mjs
          python3 conformance/heartbeat.py --adapter node ../sdk/test/adapter.mjs
      - if: inputs.language == 'c' || inputs.language == 'cpp'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libcurl4-openssl-dev libjson-c-dev
      - if: inputs.language == 'c' || inputs.language == 'cpp'
        run: cmake -S sdk -B sdk/build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - if: inputs.language == 'c' || inputs.language == 'cpp'
        run: cmake --build sdk/build -j 2
      - if: inputs.language == 'c'
        run: ctest --test-dir sdk/build --output-on-failure
      - if: inputs.language == 'c'
        working-directory: protocol
        run: |
          python3 conformance/run.py --adapter ../sdk/build/licensebox-adapter
          python3 conformance/heartbeat.py --adapter ../sdk/build/licensebox-adapter
      - if: inputs.language == 'c'
        working-directory: protocol
        run: |
          python3 conformance/run.py --adapter ../sdk/build/licensebox-json-adapter
          python3 conformance/heartbeat.py --adapter ../sdk/build/licensebox-json-adapter
      - if: inputs.language == 'cpp'
        run: python3 -B sdk/tests/candidate_config.py
      - if: inputs.language == 'cpp'
        working-directory: protocol
        run: |
          python3 conformance/run.py --adapter ../sdk/build/licensebox-cpp-adapter
          python3 conformance/heartbeat.py --adapter ../sdk/build/licensebox-cpp-adapter
      - if: inputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go.mod
      - if: inputs.language == 'go'
        working-directory: sdk
        env:
          LICENSEBOX_TEST_NATIVE: '1'
        run: go test -race ./...
      - if: inputs.language == 'go'
        working-directory: protocol/conformance/go-adapter
        run: |
          go mod edit -replace "licensebox.dev=$GITHUB_WORKSPACE/sdk"
          GOWORK=off go build -buildvcs=false -o "$GITHUB_WORKSPACE/go-adapter" .
      - if: inputs.language == 'go'
        working-directory: protocol
        run: |
          python3 conformance/run.py --adapter "$GITHUB_WORKSPACE/go-adapter"
          python3 conformance/heartbeat.py --adapter "$GITHUB_WORKSPACE/go-adapter"
      - if: steps.metadata.outputs.native == 'true'
        name: Resolve native dependency
        id: native
        run: |
          ref=$(python3 -B protocol/scripts/dependency_ref.py c sdk/native-version.txt)
          echo "tag=$ref" >> "$GITHUB_OUTPUT"
      - if: steps.metadata.outputs.native == 'true'
        uses: actions/checkout@v4
        with:
          repository: licensebox/c
          ref: ${{ steps.native.outputs.tag }}
          path: native-src
          persist-credentials: false
      - if: steps.metadata.outputs.native == 'true'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libcurl4-openssl-dev libjson-c-dev
      - if: steps.metadata.outputs.native == 'true'
        run: |
          cmake -S native-src -B native-src/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build native-src/build -j 2
          cmake --install native-src/build --prefix "$GITHUB_WORKSPACE/native"
      - if: inputs.language == 'rust'
        run: rustup default stable
      - if: inputs.language == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - if: inputs.language == 'julia'
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - if: inputs.language == 'matlab'
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          install-system-dependencies: true
      - if: inputs.language == 'swift'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.1'
      - if: inputs.language == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - if: steps.metadata.outputs.native == 'true' || steps.metadata.outputs.custom == 'true'
        name: Install language toolchain in disposable runner
        working-directory: sdk
        run: if test -f ci/setup.sh; then bash ci/setup.sh; fi
      - if: inputs.language != 'matlab' && (steps.metadata.outputs.native == 'true' || steps.metadata.outputs.custom == 'true')
        working-directory: sdk
        env:
          LICENSEBOX_LIB_DIR: ${{ github.workspace }}/native/lib
          LICENSEBOX_LIBRARY: ${{ github.workspace }}/native/lib/liblicensebox.so
          LD_LIBRARY_PATH: ${{ github.workspace }}/native/lib
        run: bash ci/test.sh
      - if: inputs.language != 'matlab' && (steps.metadata.outputs.native == 'true' || steps.metadata.outputs.custom == 'true')
        working-directory: protocol
        env:
          LICENSEBOX_LIB_DIR: ${{ github.workspace }}/native/lib
          LICENSEBOX_LIBRARY: ${{ github.workspace }}/native/lib/liblicensebox.so
          LD_LIBRARY_PATH: ${{ github.workspace }}/native/lib
        run: |
          python3 conformance/run.py --adapter bash ../sdk/ci/adapter.sh
          python3 conformance/heartbeat.py --adapter bash ../sdk/ci/adapter.sh
      - if: inputs.language == 'octave'
        name: MEX native identifier string regression
        working-directory: protocol
        env:
          LICENSEBOX_LIB_DIR: ${{ github.workspace }}/native/lib
          LICENSEBOX_LIBRARY: ${{ github.workspace }}/native/lib/liblicensebox.so
          LD_LIBRARY_PATH: ${{ github.workspace }}/native/lib
        run: python3 conformance/mex_strings.py --adapter bash ../sdk/ci/adapter.sh
      - if: inputs.language == 'matlab'
        name: MATLAB package, lifecycle and complete shared runtime conformance
        uses: matlab-actions/run-command@v3
        env:
          LICENSEBOX_INCLUDE_DIR: ${{ github.workspace }}/native/include
          LICENSEBOX_LIB_DIR: ${{ github.workspace }}/native/lib
          LICENSEBOX_LIBRARY: ${{ github.workspace }}/native/lib/liblicensebox.so
          LD_LIBRARY_PATH: ${{ github.workspace }}/native/lib
        with:
          command: cd('sdk'); addpath('ci'); github_ci()
      - uses: actions/upload-artifact@v4
        with:
          name: tested-protocol-pin
          path: |
            sdk/protocol-lock.json
            sdk/c-version.cmake
            sdk/native-version.txt
            sdk/host-dependencies.txt
          if-no-files-found: error
